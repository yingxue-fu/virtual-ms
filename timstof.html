<!DOCTYPE html>
<html lang="en">
<head>

<title>Virtual timsTOF – diaPASEF in 3D</title>
<style>
  :root{--bg:#0a0e14;--panel:#111821;--line:#223040;--ink:#e6edf3;--mute:#8b9bb0;--acc:#5cc8ff;--acc2:#ffb454;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}
  @supports (height:100dvh){#app{height:100dvh}}
  header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  .title{font-weight:650;font-size:15px}
  .title span{font-weight:400;color:var(--mute);font-size:12px;margin-left:6px}
  .controls{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
  label.ctl{display:inline-flex;gap:6px;align-items:center;color:var(--mute)}
  button.btn{background:#16202b;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
  input[type=range]{width:90px;accent-color:var(--acc)}
  #stage{position:relative;flex:1;min-height:0;overflow:hidden}
  #stage canvas{display:block}
  .labels{position:absolute;inset:0;pointer-events:none;z-index:1}
  #views,#status,#info{z-index:2}
  .lbl{pointer-events:auto;cursor:pointer;font-size:11px;padding:2px 7px;border-radius:10px;background:rgba(17,24,33,.82);border:1px solid #2c3d50;color:#cfe3f5;white-space:nowrap;user-select:none}
  .lbl:hover{border-color:var(--acc);color:#fff}
  .lbl.live{border-color:#ffb454;color:#ffd9a0}
  #status{position:absolute;left:10px;top:10px;max-width:min(calc(100% - 150px),440px);background:rgba(10,14,20,.8);border:1px solid var(--line);border-radius:10px;padding:7px 10px;pointer-events:none}
  #status b{display:block;font-size:13px;color:var(--acc2)}
  #status span{display:block;color:var(--mute);font-size:12px}
  #ramp{margin-top:5px;height:4px;background:#1b2632;border-radius:3px;overflow:hidden}
  #ramp i{display:block;height:100%;width:0;background:var(--acc)}
  #views{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:5px}
  #views button{background:rgba(17,24,33,.85);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer;text-align:left}
  #views button:hover{border-color:var(--acc)}
  #hint{position:absolute;left:10px;bottom:8px;right:10px;color:var(--mute);font-size:11px;pointer-events:none}
  #legend{display:inline-block;width:70px;height:7px;border-radius:4px;vertical-align:middle;background:linear-gradient(90deg,hsl(238,90%,62%),hsl(160,90%,55%),hsl(60,90%,55%),hsl(0,90%,60%))}
  #info{position:absolute;left:10px;right:10px;bottom:10px;max-width:520px;background:rgba(14,20,28,.96);border:1px solid #2f4357;border-radius:12px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-height:62%;overflow:auto}
  #info h3{margin:0 0 6px;font-size:14px;color:var(--acc)}
  #info p{margin:0 0 7px;color:#c9d6e3}
  #info .x{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer}
  #panel{height:235px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  .phead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 10px 0}
  #ptitle{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
  .seg button{background:transparent;border:0;color:var(--mute);padding:3px 8px;font:inherit;font-size:11px;cursor:pointer}
  .seg button.on{background:#1d2a38;color:var(--ink)}
  #pwrap{flex:1;min-height:0;position:relative}
  #pc{position:absolute;inset:0;width:100%;height:100%}
</style>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* ================= precursor cloud (m/z vs 1/K0) ================= */
const rnd=(a,b)=>a+Math.random()*(b-a);
const gauss=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());
// approximate trend lines of tryptic peptides in timsTOF data
const BAND={1:mz=>0.55+0.0011*mz, 2:mz=>0.30+0.00095*mz, 3:mz=>0.22+0.00085*mz};
const K_LO=0.55,K_HI=1.75;
const kColor=k=>new THREE.Color().setHSL(0.66*(1-Math.min(1,Math.max(0,(k-0.6)/1.0))),0.9,0.6);
const CLOUD=[];
for(let i=0;i<900;i++){const r=Math.random();const z=r<.6?2:r<.85?3:1;
  const mz=z===1?rnd(400,1100):rnd(400,1200);const k=BAND[z](mz)+0.035*gauss();
  const frags=[];const maxF=Math.min(1450,mz*z-60);for(let j=0;j<6;j++)frags.push(rnd(150,maxF));
  CLOUD.push({mz,k,z,frags,w:Math.exp(0.8*gauss()),col:kColor(k)});}
const CW=CLOUD.reduce((a,c)=>a+c.w,0);
function pickPrec(){let r=Math.random()*CW;for(const c of CLOUD){r-=c.w;if(r<=0)return c;}return CLOUD[0];}

/* ================= diaPASEF window scheme =================
   8 TIMS scans x 3 windows of 33.3 Th covering m/z 400-1200 (24 windows).
   In each scan the quad visits the high-, then middle-, then low-m/z window as 1/K0 drops during the ramp.
   1/K0 limits follow the 2+/3+ diagonal; neighbouring windows in a scan meet halfway between their natural limits,
   and singly charged ions above the diagonal are skipped. */
const NSCAN=8,NPER=3,WMZ=800/(NSCAN*NPER);
const kTop=c=>0.30+0.00095*c+0.08, kBot=c=>0.22+0.00085*c-0.06;
const SCANS=[];
for(let i=0;i<NSCAN;i++){const cs=[];for(let j=NPER-1;j>=0;j--)cs.push(400+WMZ*(i+NSCAN*j)+WMZ/2);   // high → low m/z
  const w=cs.map(c0=>({lo:c0-WMZ/2,hi:c0+WMZ/2,klo:kBot(c0),khi:kTop(c0)}));
  for(let j=0;j<w.length-1;j++){const b=(w[j].klo+w[j+1].khi)/2;w[j].klo=b;w[j+1].khi=b;}
  SCANS.push(w);}
const NFRAMES=NSCAN+1; // frame 0 = MS1, frames 1..8 = diaPASEF scans
const fmz=v=>v.toFixed(0);
function windowFor(frame,k){if(frame===0)return null;for(const w of SCANS[frame-1])if(k>=w.klo&&k<=w.khi)return w;return undefined;}
const ceFor=k=>20+(k-0.6)*39; // collision energy ramped with mobility (eV)

/* ================= scene ================= */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;
stage.prepend(renderer.domElement);
const labelR=new CSS2DRenderer();labelR.domElement.className='labels';stage.appendChild(labelR.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0e14);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(45,1,0.05,300);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xbfd8ff,0x101418,0.6));const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(5,10,8);scene.add(dl);
const grid=new THREE.GridHelper(60,60,0x1a2633,0x121b25);grid.position.y=-2.5;scene.add(grid);
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,metalness:.85,roughness:.32,...o});
const mGold=M(0xd8ab4f),mGold2=M(0xb98a35),mSteel=M(0xa9b4c2),mCopper=M(0xc27a52);
const mGlass=c=>new THREE.MeshStandardMaterial({color:c,metalness:.5,roughness:.2,transparent:true,opacity:.14,side:THREE.DoubleSide,depthWrite:false});
const pickables=[],labels={};
function comp(key,label,lp){const g=new THREE.Group();g.userData.key=key;scene.add(g);
  const d=document.createElement('div');d.className='lbl';d.textContent=label;d.addEventListener('click',e=>{e.stopPropagation();showInfo(key);});
  const o=new CSS2DObject(d);o.position.copy(lp);scene.add(o);labels[key]=d;return g;}
function add(g,m){m.userData.key=g.userData.key;g.add(m);pickables.push(m);return m;}

// geometry coordinates
const TIMS1={xa:-10.3,xb:-8.2,xc:-7.6}, TIMS2={xa:-7.1,xb:-5.0,xc:-4.4};
const QX0=-3.4,QX1=1.0,CX0=1.6,CX1=5.0,PX0=6.6,PX1=7.6,DET_DX=4.0,REFL_Y=6.5,REFL_D=1.2;

// ESI + capillary (orthogonal) + deflection transfer
const path=new THREE.CatmullRomCurve3([new THREE.Vector3(-11.5,0,7.0),new THREE.Vector3(-11.5,0,6.0),new THREE.Vector3(-11.5,0,5.0),new THREE.Vector3(-11.5,0,2.6),
  new THREE.Vector3(-11.5,0,1.3),new THREE.Vector3(-11.25,0,.4),new THREE.Vector3(-10.75,0,.05),new THREE.Vector3(-10.4,0,0)],false,'centripetal');
const PLEN=path.getLength();
function uAtZ(z){let b=0,bd=1e9;for(let i=0;i<=1000;i++){const u=i/1000,d=Math.abs(path.getPointAt(u).z-z);if(d<bd){bd=d;b=u;}}return b;}
const uCapIn=uAtZ(5.0),uCapOut=uAtZ(2.6),uDefl=uAtZ(1.3);
{const g=comp('esi','ESI source',new THREE.Vector3(-11.5,.75,8.2));
 const n=add(g,new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,2.2,16),mSteel));n.rotation.x=Math.PI/2;n.position.set(-11.5,0,8.5);
 const t=add(g,new THREE.Mesh(new THREE.ConeGeometry(.07,.35,16),mSteel));t.rotation.x=-Math.PI/2;t.position.set(-11.5,0,7.25);}
{const g=comp('cap','Glass capillary + deflection',new THREE.Vector3(-12.6,.7,3.8));
 const c=add(g,new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,2.4,28,1,true),new THREE.MeshStandardMaterial({color:0x9fd8ff,transparent:true,opacity:.28,roughness:.1,side:THREE.DoubleSide,depthWrite:false})));c.rotation.x=Math.PI/2;c.position.set(-11.5,0,3.8);
 const pl=add(g,new THREE.Mesh(new THREE.BoxGeometry(1.4,1.2,.08),mSteel));pl.position.set(-11.5,0,-.6);
 const pl2=add(g,new THREE.Mesh(new THREE.BoxGeometry(.08,1.2,1.2),mGold2));pl2.position.set(-12.2,0,.5);}
// TIMS tunnels: stacked electrode plates with rectangular apertures
function plateGeo(){const s=new THREE.Shape();s.moveTo(-.75,-.75);s.lineTo(.75,-.75);s.lineTo(.75,.75);s.lineTo(-.75,.75);s.lineTo(-.75,-.75);
  const h=new THREE.Path();h.moveTo(-.34,-.34);h.lineTo(-.34,.34);h.lineTo(.34,.34);h.lineTo(.34,-.34);h.lineTo(-.34,-.34);s.holes.push(h);
  const g=new THREE.ExtrudeGeometry(s,{depth:.05,bevelEnabled:false});g.rotateY(Math.PI/2);return g;}
const PG=plateGeo();const mPlateA=M(0xa9b4c2,{transparent:true,opacity:.35,depthWrite:false}),mPlateB=M(0xb98a35,{transparent:true,opacity:.35,depthWrite:false});
function tunnel(key,label,T,lx){const g=comp(key,label,new THREE.Vector3(lx,1.05,0));const n=16;
  for(let i=0;i<n;i++){const x=T.xa-.2+(T.xc-T.xa+.2)*i/(n-1);const m=add(g,new THREE.Mesh(PG,i%2?mPlateA:mPlateB));m.position.set(x,0,0);}
  return g;}
tunnel('tims1','TIMS 1 · accumulate',TIMS1,-8.9);tunnel('tims2','TIMS 2 · elute',TIMS2,-5.7);
// field-gradient profile over TIMS2 + gas arrows
const fieldLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(Array.from({length:40},()=>new THREE.Vector3())),new THREE.LineBasicMaterial({color:0xffb454}));scene.add(fieldLine);
const fieldLbl=document.createElement('div');fieldLbl.className='lbl';fieldLbl.style.pointerEvents='none';fieldLbl.textContent='E-field (ramping down)';
const fieldLO=new CSS2DObject(fieldLbl);fieldLO.position.set(-7.5,2.3,0);scene.add(fieldLO);
const arrows=[];{const ag=new THREE.ConeGeometry(.06,.2,8);ag.rotateZ(-Math.PI/2);const am=new THREE.MeshBasicMaterial({color:0x4b6a88,transparent:true,opacity:.7});
 for(let i=0;i<14;i++){const a=new THREE.Mesh(ag,am);a.userData={y:rnd(-.25,.25),z:rnd(-.25,.25),o:Math.random()};scene.add(a);arrows.push(a);}}
// quadrupole
{const g=comp('quad','Quadrupole',new THREE.Vector3((QX0+QX1)/2,.95,0));const geo=new THREE.CylinderGeometry(.2,.2,QX1-QX0,24);
 [[.5,0,mGold],[-.5,0,mGold],[0,.5,mGold2],[0,-.5,mGold2]].forEach(([y,z,m])=>{const r=add(g,new THREE.Mesh(geo,m));r.rotation.z=Math.PI/2;r.position.set((QX0+QX1)/2,y,z);});}
// collision cell
{const g=comp('cell','Collision cell',new THREE.Vector3((CX0+CX1)/2,.95,0));
 for(let k=0;k<6;k++){const a=k*Math.PI/3;const r=add(g,new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,CX1-CX0,10),mCopper));r.rotation.z=Math.PI/2;r.position.set((CX0+CX1)/2,.36*Math.cos(a),.36*Math.sin(a));}
 const h=add(g,new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,CX1-CX0+.1,32,1,true),mGlass(0x6fb7ff)));h.rotation.z=Math.PI/2;h.position.set((CX0+CX1)/2,0,0);}
// TOF: pusher, flight tube, reflectron, detector
{const g=comp('tof','TOF analyzer',new THREE.Vector3(9.3,8.9,0));
 const pusher=add(g,new THREE.Mesh(new THREE.BoxGeometry(1.3,.06,.9),mSteel));pusher.position.set(7.1,-.35,0);
 const grid1=add(g,new THREE.Mesh(new THREE.BoxGeometry(1.3,.02,.9),M(0x8899aa,{transparent:true,opacity:.35})));grid1.position.set(7.1,.35,0);
 const tube=add(g,new THREE.Mesh(new THREE.BoxGeometry(6.2,9.2,1.6),mGlass(0x7fa8d0)));tube.position.set(9.3,4.0,0);
 for(let i=0;i<9;i++){const y=REFL_Y+.05+i*.2;const s=new THREE.Shape();s.moveTo(-3,-.75);s.lineTo(3,-.75);s.lineTo(3,.75);s.lineTo(-3,.75);s.lineTo(-3,-.75);
  const hh=new THREE.Path();hh.moveTo(-2.8,-.6);hh.lineTo(-2.8,.6);hh.lineTo(2.8,.6);hh.lineTo(2.8,-.6);hh.lineTo(-2.8,-.6);s.holes.push(hh);
  const rg=new THREE.ExtrudeGeometry(s,{depth:.04,bevelEnabled:false});rg.rotateX(Math.PI/2);const m=add(g,new THREE.Mesh(rg,i%2?mSteel:mGold2));m.position.set(9.3,y,0);}
 const det=add(g,new THREE.Mesh(new THREE.BoxGeometry(1.6,.12,1.0),M(0x3a3f4a,{emissive:0x0b2236})));det.position.set(7.1+DET_DX,-.3,0);}
{const d=document.createElement('div');d.className='lbl';d.textContent='Pusher';d.onclick=()=>showInfo('tof');const o=new CSS2DObject(d);o.position.set(7.1,-.9,0);scene.add(o);
 const e=document.createElement('div');e.className='lbl';e.textContent='Reflectron';e.onclick=()=>showInfo('tof');const o2=new CSS2DObject(e);o2.position.set(12.9,7.4,0);scene.add(o2);
 const f=document.createElement('div');f.className='lbl';f.textContent='Detector';f.onclick=()=>showInfo('tof');const o3=new CSS2DObject(f);o3.position.set(7.1+DET_DX,-.9,0);scene.add(o3);}

/* ================= ions ================= */
const MAXI=3500;
const ions=new THREE.InstancedMesh(new THREE.SphereGeometry(.055,10,8),new THREE.MeshBasicMaterial({color:0xffffff}),MAXI);
ions.instanceMatrix.setUsage(THREE.DynamicDrawUsage);ions.setColorAt(0,new THREE.Color());ions.frustumCulled=false;ions.count=0;scene.add(ions);
const WHITE=new THREE.Color(1,1,1),GREY=new THREE.Color(0x6b7280);
let parts=[],simT=0;
function newIon(pr,o={}){const p={pr,state:'path',u:0,v:rnd(4,4.8),pos:new THREE.Vector3(),dy:rnd(-1,1),dz:rnd(-1,1),ph:rnd(0,6.3),ph2:rnd(0,6.3),scale:1,col:new THREE.Color().copy(pr?pr.col:GREY),...o};parts.push(p);return p;}
function die(p){if(p.state==='dying'||p.dead)return;p.state='dying';p.dieT=simT;p.s0=p.scale;}
function flash(pos,c=WHITE){parts.push({state:'flash',pos:pos.clone(),col:new THREE.Color().copy(c),c0:new THREE.Color().copy(c),scale:1,t0:simT});}

/* ================= frame timing ================= */
const T_XFER=0.45,T_RAMP=2.7,T_FRAME=T_XFER+T_RAMP;   // visual seconds; real ramp ≈ 100 ms
let frameIdx=0,frameT0=0,speed=1,paused=false;
const thrAt=tau=>tau<T_XFER?1.65:1.65-1.1*Math.min(1,(tau-T_XFER)/T_RAMP); // 1/K0 that is being released now
const TIMS1_THR=1.85;
function eqX(T,k,thr){return T.xa+(T.xb-T.xa)*k/thr;}
function startFrame(){frameT0=simT;frameIdx=(frameIdx+1)%NFRAMES;
  for(const p of parts)if(p.state==='acc'){p.state='t2';p.frame=frameIdx;p.mv0=p.pos.clone();p.mvT=simT;}}
let pushT=0;const PUSH_DT=0.3;
const hits=[];let shownFrame=-1;

/* ================= update ================= */
let spawnAcc=0;const RATE=105;
function amp(u){if(u<uCapIn){const s=u/uCapIn;return .05+.4*Math.sin(Math.PI*s)*(1-.3*s);}if(u<uCapOut)return .1;return .1;}
const UP=new THREE.Vector3(0,1,0);
function update(dt){
  spawnAcc+=dt*RATE;while(spawnAcc>=1){spawnAcc--;Math.random()<.1?newIon(null,{neutral:true,v:rnd(3.2,4)}):newIon(pickPrec());}
  const tau=simT-frameT0;if(tau>=T_FRAME)startFrame();
  const thr=thrAt(simT-frameT0);
  if(simT-pushT>=PUSH_DT){pushT=simT;for(const p of parts)if(p.state==='pz'){p.state='tof';p.t0=simT;p.x0=p.pos.x;p.zz=p.pos.z;p.Tf=.065*Math.sqrt(p.mz);}}
  for(const p of parts){if(p.dead)continue;
   switch(p.state){
    case 'path':{p.u+=p.v*dt/PLEN;
      if(p.neutral&&p.u>=uDefl){p.state='straight';break;}
      if(p.u>=1){p.state='acc';p.u=1;}
      const u=Math.min(p.u,.998),T=path.getTangentAt(u),side=new THREE.Vector3().crossVectors(T,UP).normalize(),a=amp(u);
      p.pos.copy(path.getPointAt(u));
      if(u<uCapIn)p.pos.addScaledVector(UP,a*p.dy).addScaledVector(side,a*p.dz);else p.pos.addScaledVector(UP,a*p.dy*Math.cos(5*simT+p.ph)).addScaledVector(side,a*p.dz*Math.sin(6*simT+p.ph2));
      if(!p.neutral){if(u<uCapOut){const k=u/uCapOut;p.scale=2.6-1.6*k;p.col.copy(WHITE).lerp(p.pr.col,k*k);}else{p.scale=1;p.col.copy(p.pr.col);}}else p.scale=1.6;
      break;}
    case 'straight':p.pos.z-=p.v*dt;if(p.pos.z<-.5)die(p);break;
    case 'acc':{const tx=eqX(TIMS1,p.pr.k,TIMS1_THR);p.pos.x+=(tx-p.pos.x)*Math.min(1,dt*3);
      p.pos.y=.12*p.dy*Math.cos(7*simT+p.ph);p.pos.z=.12*p.dz*Math.sin(8*simT+p.ph2);break;}
    case 't2':{const k=p.pr.k;
      if(simT-p.mvT<T_XFER){const e=(simT-p.mvT)/T_XFER;p.pos.x=p.mv0.x+(eqX(TIMS2,k,1.65)-p.mv0.x)*e*e*(3-2*e);}
      else if(k>=thr){p.state='go';p.pos.x=Math.max(p.pos.x,TIMS2.xb);}
      else{const tx=eqX(TIMS2,k,thr);p.pos.x+=(tx-p.pos.x)*Math.min(1,dt*6);}
      p.pos.y=.1*p.dy*Math.cos(7*simT+p.ph);p.pos.z=.1*p.dz*Math.sin(8*simT+p.ph2);break;}
    case 'go':{p.pos.x+=3.2*dt;p.pos.y*=1-dt*2;p.pos.z*=1-dt*2;
      if(p.pos.x>=QX0&&!p.qc){p.qc=true;const w=windowFor(p.frame,p.pr.k);
        if(w===undefined||(w&&(p.pr.mz<w.lo||p.pr.mz>w.hi))){p.state='rej';p.fx0=p.pos.x;p.fax=Math.random()<.5;break;}}
      if(p.pos.x>=CX0+.9&&!p.cc){p.cc=true;if(p.frame>0){fragment(p);break;}}
      if(p.pos.x>=PX0){p.state='pz';p.mz=p.mz??p.pr.mz;}
      if(p.pos.x>=QX0&&p.pos.x<=QX1){p.pos.y=.08*p.dy*Math.cos(13*simT+p.ph);p.pos.z=.08*p.dz*Math.sin(15*simT+p.ph2);}
      break;}
    case 'rej':{p.pos.x+=2.6*dt;const A=.1*Math.exp(3*(p.pos.x-p.fx0));const o=A*Math.sin(14*simT+p.ph);p.pos.y=p.fax?o:.04*Math.sin(9*simT);p.pos.z=p.fax?.04*Math.cos(9*simT):o;
      if(A>.42){p.col.setRGB(1,.35,.3);die(p);}break;}
    case 'pz':p.pos.x=Math.min(PX1,p.pos.x+.25*dt);p.pos.y*=1-dt*3;break;
    case 'tof':{const t=simT-p.t0,Tf=p.Tf,v=(2*REFL_Y+4*REFL_D)/Tf,ta=REFL_Y/v,tr=2*REFL_D/v,ac=v*v/(2*REFL_D);let y;
      if(t<ta)y=v*t;else if(t<ta+tr){const s=t-ta;y=REFL_Y+v*s-.5*ac*s*s;}else if(t<ta+2*tr){const s=t-ta-tr;y=REFL_Y+REFL_D-.5*ac*s*s;}else y=REFL_Y-v*(t-ta-2*tr);
      p.pos.set(p.x0+DET_DX*t/Tf,y,p.zz);
      if(t>=Tf){p.pos.y=0;hit(p);flash(p.pos,p.col);p.dead=true;}break;}
    case 'flash':{const k=(simT-p.t0)/.35;p.scale=1+5*k;p.col.copy(p.c0).multiplyScalar(Math.max(0,1-k));if(k>=1)p.dead=true;break;}
    case 'dying':{const k=(simT-p.dieT)/.4;p.scale=p.s0*(1-k);if(k>=1)p.dead=true;break;}
   }}
  parts=parts.filter(p=>!p.dead);if(parts.length>MAXI)parts.splice(0,parts.length-MAXI);
  // field line + gas arrows
  const pts=fieldLine.geometry.attributes.position;
  for(let i=0;i<40;i++){const x=TIMS2.xa-.2+(TIMS2.xc+.1-TIMS2.xa+.2)*i/39;const g=x<TIMS2.xa?0:x<TIMS2.xb?(x-TIMS2.xa)/(TIMS2.xb-TIMS2.xa):x<=TIMS2.xc?1:0;
    pts.setXYZ(i,x,1.0+.9*g*(thr/1.65),0);}pts.needsUpdate=true;
  for(const a of arrows){a.userData.o=(a.userData.o+dt*.35)%1;a.position.set(TIMS1.xa-.2+(TIMS2.xc-TIMS1.xa+.2)*a.userData.o,a.userData.y,a.userData.z);}
}
function fragment(p){flash(p.pos);const n=3;for(let j=0;j<n;j++){const c=newIon(p.pr,{state:'go',qc:true,cc:true,frame:p.frame,mz:p.pr.frags[(j*2+Math.floor(Math.random()*2))%6]});
  c.pos.copy(p.pos).add(new THREE.Vector3(rnd(-.1,.1),rnd(-.15,.15),rnd(-.15,.15)));c.dy=rnd(-1,1);c.dz=rnd(-1,1);}p.dead=true;}
function hit(p){if(p.frame!==shownFrame){shownFrame=p.frame;hits.length=0;}hits.push({mz:p.mz,k:p.pr.k,col:p.col.clone()});
  if(p.frame>0)hits.push({mz:p.pr.frags[Math.floor(Math.random()*6)],k:p.pr.k,col:p.col.clone()});}
const mtx=new THREE.Matrix4(),qI=new THREE.Quaternion(),sv=new THREE.Vector3();
function writeInstances(){let n=0;for(const p of parts){sv.setScalar(Math.max(p.scale,1e-4));mtx.compose(p.pos,qI,sv);ions.setMatrixAt(n,mtx);ions.setColorAt(n,p.col);n++;}
  ions.count=n;ions.instanceMatrix.needsUpdate=true;if(ions.instanceColor)ions.instanceColor.needsUpdate=true;}

/* ================= status ================= */
const stT=document.getElementById('stT'),stS=document.getElementById('stS'),rampBar=document.querySelector('#ramp i');
function quadNow(){const tau=simT-frameT0-1.0/3.2*0+((TIMS2.xb-QX0)<0?0:0);// window active for ions now entering the quad
  const tq=tau-(QX0-TIMS2.xb)/3.2;const k=thrAt(Math.max(0,tq));return {k,w:frameIdx===0?null:windowFor(frameIdx,k),tq};}
function updateStatus(){const tau=simT-frameT0,thr=thrAt(tau);rampBar.style.width=Math.min(100,100*tau/T_FRAME)+'%';
  const q=quadNow();
  if(frameIdx===0){stT.textContent=`Frame 1/${NFRAMES} · MS1 (PASEF off)`;stS.textContent=tau<T_XFER?'TIMS 1 → TIMS 2 transfer; TIMS 1 keeps accumulating':`Eluting 1/K₀ ≈ ${thr.toFixed(2)} · quad open · low collision energy`;labels.quad.textContent='Quadrupole · open';labels.quad.classList.remove('live');}
  else{const s=frameIdx;stT.textContent=`Frame ${s+1}/${NFRAMES} · diaPASEF scan ${s}`;
    stS.textContent=tau<T_XFER?`TIMS 1 → TIMS 2 transfer · windows m/z ${SCANS[s-1].map(w=>fmz(w.lo)+'–'+fmz(w.hi)).join(', ')}`:
      (()=>{const wn=windowFor(frameIdx,thr);return `Eluting 1/K₀ ≈ ${thr.toFixed(2)} · quad ${wn?`on m/z ${fmz(wn.lo)}–${fmz(wn.hi)}`:'idle (no window here)'} · CE ${ceFor(Math.max(.6,thr)).toFixed(0)} eV`;})();
    labels.quad.textContent=q.w&&q.tq>T_XFER?`Quadrupole · ${fmz(q.w.lo)}–${fmz(q.w.hi)}`:'Quadrupole';labels.quad.classList.toggle('live',!!(q.w&&q.tq>T_XFER));}}

/* ================= panel ================= */
const cv=document.getElementById('pc'),cx=cv.getContext('2d');let tab='scheme';
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));});
function drawPanel(){const dpr=Math.min(devicePixelRatio,2),W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);cx.font='10px system-ui,sans-serif';
  const L=34,T=8,w=W-L-10,h=H-T-26,title=document.getElementById('ptitle');
  const ms2frame=tab==='frame'&&shownFrame>0;
  const mlo=ms2frame?100:380,mhi=ms2frame?1500:1220;
  const X=m=>L+(m-mlo)/(mhi-mlo)*w,Y=k=>T+h-(k-K_LO)/(K_HI-K_LO)*h;
  cx.strokeStyle='#2b3a4b';cx.strokeRect(L,T,w,h);cx.fillStyle='#8b9bb0';
  for(let m=Math.ceil(mlo/200)*200;m<=mhi;m+=200)cx.fillText(m,X(m)-10,T+h+11);cx.fillText('m/z',L+w-18,T+h+22);
  for(const k of[.6,.8,1,1.2,1.4,1.6])cx.fillText(k.toFixed(1),L-22,Y(k)+3);
  cx.save();cx.translate(9,T+h/2+16);cx.rotate(-Math.PI/2);cx.fillText('1/K₀ (V·s/cm²)',0,0);cx.restore();
  const tau=simT-frameT0,thr=thrAt(tau);
  if(tab==='scheme'){
    title.textContent=frameIdx===0?'diaPASEF window scheme · now: MS1 frame (all ions)':`diaPASEF scheme · ${NSCAN} scans × ${NPER} windows (${WMZ.toFixed(1)} Th) · now scan ${frameIdx}`;
    for(const c of CLOUD){cx.fillStyle=c.z===1?'rgba(255,138,122,.45)':'rgba(140,190,230,.45)';cx.fillRect(X(c.mz)-1,Y(c.k)-1,2,2);}
    SCANS.forEach((sc,i)=>{for(const wd of sc){const cur=i===frameIdx-1;const act=cur&&tau>T_XFER&&thr>=wd.klo&&thr<=wd.khi;
      cx.fillStyle=act?'rgba(255,180,84,.45)':cur?'rgba(255,180,84,.18)':'rgba(92,200,255,.05)';cx.strokeStyle=cur?'#ffb454':'rgba(92,200,255,.35)';cx.lineWidth=cur?1.5:.7;
      const x0=X(wd.lo),x1=X(wd.hi),y0=Y(wd.khi),y1=Y(wd.klo);cx.fillRect(x0,y0,x1-x0,y1-y0);cx.strokeRect(x0,y0,x1-x0,y1-y0);}});
    if(tau>T_XFER){cx.strokeStyle='#fff';cx.setLineDash([4,3]);cx.lineWidth=1;cx.beginPath();cx.moveTo(L,Y(thr));cx.lineTo(L+w,Y(thr));cx.stroke();cx.setLineDash([]);
      cx.fillStyle='#fff';cx.fillText('eluting now',L+4,Y(thr)-3);}
    cx.fillStyle='rgba(255,138,122,.9)';cx.fillText('1+ (skipped)',X(420),Y(1.55));cx.fillStyle='rgba(160,205,240,.95)';cx.fillText('2+ / 3+ peptides',X(1010),Y(.72));
  }else{
    title.textContent=shownFrame<0?'Detector frame · waiting for ions':shownFrame===0?`Detector frame: MS1 · ${hits.length} ion hits`:`Detector frame: diaPASEF scan ${shownFrame} · ${hits.length} fragment hits`;
    for(const p of hits){cx.fillStyle='#'+p.col.getHexString();cx.beginPath();cx.arc(X(p.mz),Y(p.k),2.2,0,7);cx.fill();}
    if(shownFrame>0){cx.fillStyle='#dbe7f3';cx.fillText('Fragments keep their precursor’s 1/K₀ → horizontal rows',L+6,T+12);
      for(const wd of SCANS[shownFrame-1]){cx.strokeStyle='rgba(255,180,84,.6)';cx.setLineDash([3,3]);cx.strokeRect(L,Y(wd.khi),w,Y(wd.klo)-Y(wd.khi));cx.setLineDash([]);
        cx.fillStyle='#ffb454';cx.fillText(`window ${fmz(wd.lo)}–${fmz(wd.hi)}`,L+w-80,Y(wd.khi)+11);}}
  }}

/* ================= info ================= */
const INFO={
 esi:['Electrospray ionization','<p>The same ESI as on any LC-MS. Charged droplets (white) shrink until bare peptide ions remain. On a timsTOF this is usually nanoflow ESI (the CaptiveSpray source).</p>'],
 cap:['Glass capillary + deflection transfer','<p>Ions enter the vacuum through a glass capillary, then the deflection transfer bends them 90° into the TIMS funnel. Neutral molecules and droplets (grey) can’t follow the turn and are pumped away.</p>'],
 tims1:['TIMS 1: accumulation','<p>Gas streams through the tunnel toward the exit while an electric field gradient pushes back on the ions. Each ion stops where the push of the gas balances the field. That position depends on its mobility, so ions sort themselves by 1/K₀ (roughly size ÷ charge) while they wait.</p><p>The <b>dual</b> TIMS is the key trick. TIMS 1 keeps collecting ions while TIMS 2 analyzes the previous batch, so almost no ions are wasted (close to 100% duty cycle). At the start of each frame the whole batch moves from TIMS 1 to TIMS 2.</p>'],
 tims2:['TIMS 2: elution (the ramp)','<p>Over one ramp (about 100 ms on the real instrument) the field is lowered (orange line). Ions with low mobility (high 1/K₀: large, low charge) need the strongest field to hold them, so they leave first. Then come smaller, more compact ions. That is the reverse of a classic drift tube.</p><p>The result is a time axis that encodes 1/K₀. Everything downstream (quad, collision energy) is synchronized to it.</p>'],
 quad:['Quadrupole, synchronized to mobility','<p>This is the “PASEF” part. Because ion mobility and m/z are correlated (larger peptides tend to have higher m/z), the quad doesn’t need to sit on one window for the whole ramp. In each diaPASEF scan it holds a high-m/z window while high-1/K₀ ions elute, then steps down to a middle and then a low-m/z window as smaller ions follow. In this scheme that’s 3 windows of 33 Th per 100 ms ramp, so 8 ramps plus one MS1 frame cover m/z 400–1200 in a cycle of about 0.9 s.</p><p>The 1/K₀ ranges of the windows follow the diagonal of multiply charged peptides, so singly charged contaminants (the top band) are mostly skipped. Ions outside the active window spiral into the rods (red).</p>'],
 cell:['Collision cell','<p>Precursors that pass the quad are fragmented by collisions with N₂. On a timsTOF the collision energy is <b>ramped with mobility</b>, here from about 59 eV at 1/K₀ 1.6 down to 20 eV at 0.6. Larger ions need more energy to fragment well.</p><p>In DIA every precursor in the window fragments together, so the spectrum is a mixture. The mobility dimension helps take it apart.</p>'],
 tof:['Orthogonal-acceleration TOF','<p>Ions drift into the <b>pusher</b>. Every few tens of microseconds (here every 0.3 s of animation) a voltage pulse kicks them upward. All ions get the same energy, so speed scales with 1/√(m/z): light ions arrive first.</p><p>The <b>reflectron</b> (ion mirror at the top) turns them around. Faster ions of the same m/z dig deeper into the mirror, which cancels small energy differences and sharpens peaks. Ions keep their sideways drift, so the path is a V that ends on the detector.</p><p>Thousands of pushes per ramp are stacked into one <b>frame</b>, which records m/z × 1/K₀ (see Detector frame).</p>']};
const info=document.getElementById('info');
function showInfo(k){document.getElementById('infoT').textContent=INFO[k][0];document.getElementById('infoB').innerHTML=INFO[k][1];info.hidden=false;}
document.getElementById('infoX').onclick=()=>info.hidden=true;
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)return;const r=renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);const h=ray.intersectObjects(pickables,false)[0];if(h)showInfo(h.object.userData.key);});

/* ================= camera ================= */
let camAnim=null;
function view(v){const a=camera.aspect,k=1/Math.min(a,1.3);let tgt,pos;
  if(v==='overview'){tgt=new THREE.Vector3(-.5,2.4,0);pos=a<1?tgt.clone().add(new THREE.Vector3(-.55,.45,.75).normalize().multiplyScalar(26/Math.max(a,.5))):tgt.clone().add(new THREE.Vector3(.1,.35,1).normalize().multiplyScalar(Math.max(22,34/Math.min(a,1.7))));}
  else if(v==='tims'){tgt=new THREE.Vector3(-7.4,.3,0);pos=new THREE.Vector3(-7.9,3.6,5.2*k);}
  else if(v==='quad'){tgt=new THREE.Vector3(.8,0,0);pos=new THREE.Vector3(-.5,3,6.5*k);}
  else{tgt=new THREE.Vector3(9.3,3.6,0);pos=new THREE.Vector3(9.3,4.2,13*k);}
  camAnim={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,s:performance.now()};}
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>view(b.dataset.v));
document.getElementById('speed').oninput=e=>speed=+e.target.value;
const pb=document.getElementById('pause');pb.onclick=()=>{paused=!paused;pb.textContent=paused?'Play':'Pause';};
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);labelR.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
view('overview');camera.position.copy(camAnim.p1);controls.target.copy(camAnim.t1);camAnim=null;

/* ================= loop ================= */
frameIdx=NFRAMES-1;frameT0=0;
for(let i=0;i<360;i++){simT+=1/60;update(1/60);}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  if(camAnim){let k=Math.min(1,(now-camAnim.s)/900);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(camAnim.p0,camAnim.p1,k);controls.target.lerpVectors(camAnim.t0,camAnim.t1,k);if(k>=1)camAnim=null;}
  if(!paused){simT+=dt*speed;update(dt*speed);}
  writeInstances();updateStatus();drawPanel();controls.update();renderer.render(scene,camera);labelR.render(scene,camera);}
requestAnimationFrame(loop);
</script>
</body>
