import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const rnd=(a,b)=>a+Math.random()*(b-a);
const gauss=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());
const mzColor=mz=>new THREE.Color().setHSL(0.76*(1-Math.min(1,Math.max(0,(mz-150)/1250))),0.9,0.6);

/* ============ simulated precursors + narrow-window DIA scheme ============ */
const PREC=[];
for(let i=0;i<1500;i++){const mz=380+600*Math.pow(Math.random(),1.25);const z=Math.random()<.7?2:3;
  const frags=[];const mx=Math.min(1400,mz*z-80);for(let j=0;j<8;j++)frags.push({mz:rnd(150,mx),I:Math.random()});
  PREC.push({mz,z,I:Math.exp(1.1*gauss()),frags,col:mzColor(mz)});}
const WLO=380,WHI=980;   // DIA range; window width is selectable (nDIA uses 2 Th → 300 windows)
const PW=PREC.reduce((a,p)=>a+p.I,0);
function pickAny(){let r=Math.random()*PW;for(const p of PREC){r-=p.I;if(r<=0)return p;}return PREC[0];}

/* ============ acquisition schedule (slots) ============
   One cycle = 1 MS1 slot + one MS2 slot per window, stepping through the windows in order (low → high m/z).
   MS2 packet pipeline: slot s quad + IRM fill → s+1 ion processor (HCD) → s+2 Astral flight.
   MS1 packet: Orbitrap transient runs in parallel with the next MS2 scans (up to 100 of them, ≈ a 240k transient at 200 Hz). */
const D=3.0;
function makeCfg(start,ww){const n=Math.round((WHI-WLO)/ww),wins=[];
  for(let i=0;i<n;i++){const lo=WLO+ww*i;wins.push({lo,hi:lo+ww,i,n,ww,prec:PREC.filter(p=>p.mz>=lo&&p.mz<lo+ww)});}
  return {start,ww,n,per:n+1,ot:Math.min(100,n),wins};}
const CFGS=[makeCfg(0,20)];
function cfgOf(s){let c=CFGS[0];for(const k of CFGS)if(s>=k.start)c=k;return c;}
const isMS1=s=>{if(s<0)return false;const c=cfgOf(s);return (s-c.start)%c.per===0;};
function winOf(s){if(s<0)return null;const c=cfgOf(s),r=(s-c.start)%c.per;return r===0?null:c.wins[r-1];}
const OTE=new Map();
function otEnd(s){if(OTE.has(s))return OTE.get(s);let e=s+1+cfgOf(s).ot-.1;for(let k=s+1;k<e;k++)if(isMS1(k)){e=Math.min(e,k+1.2);break;}OTE.set(s,e);return e;}  // transient ends early if the next MS1 packet arrives
function lastMS1Slot(s){for(let k=s;k>=0&&k>s-200;k--)if(isMS1(k))return k;return -1;}
let simT=-5,curSlot=-1,speed=1,paused=false;
const slotOf=t=>Math.floor(t/D);

/* ============ scene ============ */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;stage.prepend(renderer.domElement);
const labelR=new CSS2DRenderer();labelR.domElement.className='labels';stage.appendChild(labelR.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0e14);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(45,1,0.05,600);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xbfd8ff,0x101418,0.6));const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(5,10,8);scene.add(dl);
const grid=new THREE.GridHelper(120,60,0x1a2633,0x121b25);grid.position.y=-4.2;scene.add(grid);
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,metalness:.85,roughness:.32,...o});
const mGold=M(0xd8ab4f),mGold2=M(0xb98a35),mSteel=M(0xa9b4c2),mCopper=M(0xc27a52);
const mGlass=c=>new THREE.MeshStandardMaterial({color:c,metalness:.5,roughness:.2,transparent:true,opacity:.14,side:THREE.DoubleSide,depthWrite:false});
const pickables=[];
function comp(key,label,lp){const g=new THREE.Group();g.userData.key=key;scene.add(g);
  const d=document.createElement('div');d.className='lbl';d.textContent=label;d.addEventListener('click',e=>{e.stopPropagation();showInfo(key);});
  const o=new CSS2DObject(d);o.position.copy(lp);scene.add(o);return g;}
function add(g,m){m.userData.key=g.userData.key;g.add(m);pickables.push(m);return m;}
function rodsX(g,x0,x1,r,n,rr,mat,phase=0){for(let k=0;k<n;k++){const a=phase+k*2*Math.PI/n;const m=add(g,new THREE.Mesh(new THREE.CylinderGeometry(rr,rr,x1-x0,12),mat));m.rotation.z=Math.PI/2;m.position.set((x0+x1)/2,r*Math.cos(a),r*Math.sin(a));}}
function housing(g,x0,x1,r,c){const h=add(g,new THREE.Mesh(new THREE.CylinderGeometry(r,r,x1-x0,32,1,true),mGlass(c)));h.rotation.z=Math.PI/2;h.position.set((x0+x1)/2,0,0);}
function smallLbl(t,pos){const d=document.createElement('div');d.className='lbl';d.style.cssText='font-size:10px;opacity:.85';d.textContent=t;const o=new CSS2DObject(d);o.position.copy(pos);scene.add(o);}

/* ---- scale: 1 scene unit = 20 mm.
   Published (Stewart et al. 2023/2024, Thermo ASMS 2023): mirrors 5 electrodes each, effective inter-mirror separation ≈ 640 mm,
   drift reversal ≈ 335 mm from injection, ~24 oscillations (>30 m), injection angle ≈ 2°, mirror convergence ≈ 0.3 mm,
   350 mm octapole before the ion processor, ion processor r0 = 2 mm, ion foil plates above and below the beam.
   Everything else (front-end lengths, Orbitrap size, mirror block height/length, foil outline) is an estimate. ---- */
const MM=1/20;

// front-end path ESI → quad entrance
const path=new THREE.CatmullRomCurve3([new THREE.Vector3(-36,0,1.5),new THREE.Vector3(-35.6,0,1.5),new THREE.Vector3(-35,0,1.5),new THREE.Vector3(-30,0,1.5),
  new THREE.Vector3(-26.6,0,1.5),new THREE.Vector3(-26.2,0,1.5),new THREE.Vector3(-24.5,0,1.3),new THREE.Vector3(-22.7,0,.6),new THREE.Vector3(-20.9,0,.08),new THREE.Vector3(-19.2,0,0),new THREE.Vector3(-18.5,0,0)],false,'centripetal');
const PLEN=path.getLength();
function uAtX(x){let b=0,bd=1e9;for(let i=0;i<=1500;i++){const u=i/1500,d=Math.abs(path.getPointAt(u).x-x);if(d<bd){bd=d;b=u;}}return b;}
const uCapIn=uAtX(-35),uCapOut=uAtX(-30),uFunOut=uAtX(-26.6),uBend=uAtX(-26.2);
const UP=new THREE.Vector3(0,1,0);
const fr=u=>{u=Math.min(Math.max(u,.001),.998);const T=path.getTangentAt(u),side=new THREE.Vector3().crossVectors(T,UP).normalize(),up2=new THREE.Vector3().crossVectors(side,T).normalize();return{T,side,up2};};
const NEUTRAL_END=-21;

{const g=comp('esi','ESI source',new THREE.Vector3(-37,.8,1.5));
 const n=add(g,new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,2.4,16),mSteel));n.rotation.z=Math.PI/2;n.position.set(-37.4,0,1.5);
 const t=add(g,new THREE.Mesh(new THREE.ConeGeometry(.05,.3,16),mSteel));t.rotation.z=-Math.PI/2;t.position.set(-36.1,0,1.5);
 const sw=add(g,new THREE.Mesh(new THREE.ConeGeometry(.9,.6,40,1,true),M(0x9aa3ae,{side:THREE.DoubleSide})));sw.rotation.z=Math.PI/2;sw.position.set(-35.3,0,1.5);}
{const g=comp('tube','Ion transfer tube',new THREE.Vector3(-32.5,.6,1.5));
 const c=add(g,new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,5,24,1,true),M(0xb8a89a,{transparent:true,opacity:.5,side:THREE.DoubleSide,emissive:0x3a1400,depthWrite:false})));c.rotation.z=Math.PI/2;c.position.set(-32.5,0,1.5);
 const coil=[];for(let i=0;i<=400;i++){const t=i/400,a=t*Math.PI*2*22;coil.push(new THREE.Vector3(-34.2+3.2*t,.32*Math.cos(a),1.5+.32*Math.sin(a)));}
 add(g,new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(coil),800,.035,6),mCopper));}
{const g=comp('funnel','Ion funnel',new THREE.Vector3(-28.1,1.3,1.5));
 for(let i=0;i<14;i++){const s=i/13,x=-29.6+3*s,r=1.0-.82*s;const t=add(g,new THREE.Mesh(new THREE.TorusGeometry(r,.03,8,48),i%2?mSteel:mGold2));t.rotation.y=Math.PI/2;t.position.set(x,0,1.5);}}
{const g=comp('guide','Bent beam guide',new THREE.Vector3(-22.7,.7,1.1));const u0=uBend,u1=uAtX(-19.2);
 for(let k=0;k<4;k++){const a=Math.PI/4+k*Math.PI/2,pts=[];for(let i=0;i<=40;i++){const u=u0+(u1-u0)*i/40,f=fr(u);pts.push(path.getPointAt(u).add(f.up2.clone().multiplyScalar(.22*Math.cos(a))).add(f.side.clone().multiplyScalar(.22*Math.sin(a))));}
  add(g,new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),60,.04,8),mCopper));}}
const QX0=-18.5,QX1=-9.5,QR=.3;
{const g=comp('quad','Quadrupole',new THREE.Vector3(-14,.75,0));const geo=new THREE.CylinderGeometry(.13,.13,QX1-QX0,24);
 [[QR+.1,0,mGold],[-QR-.1,0,mGold],[0,QR+.1,mGold2],[0,-QR-.1,mGold2]].forEach(([y,z,m])=>{const r=add(g,new THREE.Mesh(geo,m));r.rotation.z=Math.PI/2;r.position.set((QX0+QX1)/2,y,z);});}
// C-trap (bent trap) + ultra-high-field Orbitrap (small!)
const CTX=-8.4,ctrapY=x=>-0.25*Math.pow((x-CTX)/0.8,2);
{const g=comp('ctrap','Bent trap (C-trap)',new THREE.Vector3(CTX,.7,0));
 [[.2,0],[-.2,0],[0,.2],[0,-.2]].forEach(([oy,oz])=>{const pts=[];for(let i=0;i<=20;i++){const x=CTX-.8+1.6*i/20;pts.push(new THREE.Vector3(x,ctrapY(x)+oy,oz));}add(g,new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),30,.05,10),mSteel));});}
const O=new THREE.Vector3(CTX,-2.6,0),OS=.4;   // Orbitrap drawn ~38 mm long, ~26 mm wide (estimate)
{const g=comp('orbi','Orbitrap (MS1)',new THREE.Vector3(CTX+1.5,-2.6,0));g.position.copy(O);g.scale.setScalar(OS);
 const cp=[new THREE.Vector2(0,-2.45)];for(let i=0;i<=40;i++){const z=-2.4+4.8*i/40;cp.push(new THREE.Vector2(.16+.3*(1-(z/2.4)**2),z));}cp.push(new THREE.Vector2(0,2.45));
 const cg=new THREE.LatheGeometry(cp,48);cg.rotateX(Math.PI/2);add(g,new THREE.Mesh(cg,mSteel));
 const ro=z=>.95+.65*(1-(z/2.4)**2);
 for(const sgn of[1,-1]){const op=[];for(let i=0;i<=30;i++){const z=sgn*(0.06+2.34*i/30);op.push(new THREE.Vector2(ro(z),z));}
  const og=new THREE.LatheGeometry(sgn>0?op:op.reverse(),64);og.rotateX(Math.PI/2);add(g,new THREE.Mesh(og,new THREE.MeshStandardMaterial({color:0xff4d6d,emissive:0x5a0d1c,metalness:.5,roughness:.3,transparent:true,opacity:.35,side:THREE.DoubleSide,depthWrite:false})));}}
// IRM, transfer octapole, ion processor
const IRM={x0:-7,x1:-1};
{const g=comp('irm','Ion routing multipole',new THREE.Vector3(-4,.75,0));rodsX(g,IRM.x0,IRM.x1,.25,4,.06,mCopper,Math.PI/4);housing(g,IRM.x0,IRM.x1,.45,0x6fb7ff);}
const OCT={x0:-.6,x1:-.6+350*MM};
{const g=comp('oct','Transfer octapole (350 mm)',new THREE.Vector3((OCT.x0+OCT.x1)/2,.6,0));rodsX(g,OCT.x0,OCT.x1,.2,8,.025,mSteel);}
const IP={x0:17.3,xm:19.3,x1:20.8};
{const g=comp('ip','Ion processor',new THREE.Vector3(19,.75,0));rodsX(g,IP.x0,IP.xm,.16,4,.06,mCopper,Math.PI/4);housing(g,IP.x0,IP.xm,.4,0x6fb7ff);
 rodsX(g,IP.xm+.1,IP.x1,.16,4,.06,mSteel,Math.PI/4);housing(g,IP.xm+.1,IP.x1,.36,0x9fa8ff);}
smallLbl('high P · HCD',new THREE.Vector3(18.3,-.75,0));smallLbl('low P · extract',new THREE.Vector3(20.1,-.75,0));
// injection optics: letterbox lenses + prism deflector. Layout follows the plan-view schematic in Stewart et al. 2023:
// mirrors start well before the injection prism, detector + second prism sit at the proximal end beside the beam axis.
const A={x0:23.4,Ld:335*MM,W:640*MM,N:24,tilt:6*MM};   // tilt drawn ×20 (real convergence ≈ 0.3 mm)
const AENTRY=new THREE.Vector3(A.x0,0,0),DET=new THREE.Vector3(A.x0-3.2,0,-6.5);
{const g=comp('inj','Injection optics',new THREE.Vector3(21.9,.8,0));
 for(const x of[21.2,22.0]){const l=add(g,new THREE.Mesh(new THREE.BoxGeometry(.12,.9,1.4),mSteel));l.position.set(x,0,0);const h=add(g,new THREE.Mesh(new THREE.BoxGeometry(.13,.12,.9),new THREE.MeshBasicMaterial({color:0x0a0e14})));h.position.set(x,0,0);}
 const pr=new THREE.Shape();pr.moveTo(0,-.7);pr.lineTo(1.0,0);pr.lineTo(0,.7);pr.lineTo(0,-.7);const pg=new THREE.ExtrudeGeometry(pr,{depth:.06,bevelEnabled:false});pg.rotateX(Math.PI/2);
 for(const y of[.25,-.19]){const m=add(g,new THREE.Mesh(pg,mSteel));m.position.set(22.4,y,0);}
 for(const y of[.25,-.19]){const m=add(g,new THREE.Mesh(pg,mSteel));m.rotation.y=Math.PI/2;m.position.set(A.x0-2.8,y,3.3);}}   // second prism
smallLbl('prism 2',new THREE.Vector3(A.x0-2.8,-.8,4.4));
// mirror blocks: 5 electrodes each (pairs above/below a slit), ~480 mm long, faces ~450 mm apart (from schematic proportions)
const mSlab=M(0xb7bec8,{roughness:.45}),mSlab2=M(0x8f98a4,{roughness:.45});
const MIR={len:480*MM,x0:A.x0-5.5,face:11.25,th:.9,gap:.4,h:1.6,slit:.25};
{const g=comp('mirrors','Asymmetric ion mirrors',new THREE.Vector3(A.x0+9,2.4,-MIR.face-3.5));
 for(const side of[1,-1]){const grp=new THREE.Group();grp.position.set(MIR.x0,0,side*MIR.face);if(side<0)grp.rotation.y=-Math.atan(A.tilt/MIR.len);g.add(grp);
  for(let i=0;i<5;i++)for(const sy of[1,-1]){const th=i===0?MIR.th*1.4:MIR.th;const zc=side*(i===0?th/2:MIR.th*1.4+MIR.gap+(i-1)*(MIR.th+MIR.gap)+MIR.th/2);
    const b=add(grp,new THREE.Mesh(new THREE.BoxGeometry(MIR.len,MIR.h,th),i%2?mSlab2:mSlab));b.userData.key='mirrors';b.position.set(MIR.len/2,sy*(MIR.slit+MIR.h/2),zc);}}}
// Ion foil, traced from the schematic (plan view): a central bell that starts at the injection prism and widens with drift,
// plus two outer wedges near the mirrors that narrow with drift. Plates sit above and below the beam.
function foilShape(pts){const sh=new THREE.Shape();sh.moveTo(pts[0][0],pts[0][1]);for(const q of pts.slice(1))sh.lineTo(q[0],q[1]);const g=new THREE.ShapeGeometry(sh);g.rotateX(Math.PI/2);return g;}
const FL=16.2,ns=48;
const bell=[],up=[],lo=[];
for(let i=0;i<=ns;i++){const s=i/ns,x=FL*s;bell.push([x,-(3.0*Math.pow(s,.6))]);}

function update(dt){
  let sa=update.acc=(update.acc||0)+dt*115;while(update.acc>=1){update.acc--;spawn();}
  const S=slotOf(simT);if(S!==curSlot){for(let s=curSlot+1;s<=S;s++)onSlot(s);curSlot=S;}
  for(const p of parts){if(p.dead)continue;
   switch(p.state){
    case 'path':{p.u+=p.v*dt/PLEN;
      if(p.neutral&&p.u>=uBend){p.state='straight';break;}
      if(p.u>=1){p.u=1;if(p.slot<0){die(p);break;}const w=winOf(p.slot);
        if(w&&(p.mz<w.lo||p.mz>w.hi)){p.state='rej';p.fx0=QX0;p.pos.x=QX0;p.fax=Math.random()<.5;break;}

    case 'rej':{p.pos.x+=2.6*dt;const Aa=.06*Math.exp(1.2*(p.pos.x-p.fx0));const o=Aa*Math.sin(14*simT+p.ph);p.pos.y=p.fax?o:.04*Math.sin(9*simT);p.pos.z=p.fax?.04*Math.cos(9*simT):o;if(Aa>.3){p.col.setRGB(1,.35,.3);die(p);}break;}

      break;}
    case 'lp':{const b=p.base;p.pos.set(b.x+.05*Math.sin(5*simT+p.ph),b.y,b.z);if(p.injT&&simT>=p.injT){p.injT=0;moveTo(p,AENTRY.clone(),.3,'astral');}break;}

const INFO={
 esi:['Electrospray ionization','<p>Same front end as the Orbitrap Exploris family. Charged droplets (white) shrink into peptide ions.</p>'],
 tube:['Ion transfer tube','<p>A heated tube that carries ions from atmosphere into the first vacuum stage.</p>'],
 funnel:['Ion funnel','<p>RF rings that collect the expanding gas jet and focus it into a tight ion beam.</p>'],
 guide:['Bent beam guide','<p>An RF guide with a bend. Ions follow it; neutrals and droplets (grey) fly straight and are pumped away.</p>'],
 quad:['Quadrupole','<p>For MS1 it is open. For DIA MS2 it isolates very narrow windows. Narrow-window DIA (nDIA) used 2-Th windows. Everything outside the window crashes into the rods (red), which is why the rest of the instrument has to waste almost nothing.</p><p>Each DIA cycle starts with one MS1 scan, then the quad steps through consecutive windows from low to high m/z (380 → 980) and the cycle repeats. Choose the window width at the top. 2 Th (300 windows) is the real nDIA method, but a full sweep then takes minutes at animation speed. 20 Th (30 windows) lets you watch a whole cycle.</p>'],
 ctrap:['Bent trap (C-trap)','<p>Collects the MS1 packet, squeezes it into a short bunch and fires it into the Orbitrap, just as on an Exploris.</p>'],
 orbi:['Ultra-high-field Orbitrap (MS1)','<p>Note how small it is next to the Astral analyzer, just a few centimetres (size estimated). Measures the MS1 scan at high resolution (typically 240,000) and high dynamic range. A long transient takes time, so the Orbitrap keeps oscillating its one MS1 packet <b>while</b> the Astral measures many MS2 scans. In this animation that is 8. On the real instrument, Thermo describes about 100 Astral MS2 scans during one 240k MS1 scan.</p>'],
 irm:['Ion routing multipole (IRM)','<p>A gas-filled quadrupole ion guide (about 10⁻² mbar N₂) that traps and routes ions. It can also do HCD for Orbitrap MS2, but here it is the switching point: MS1 packets go back through the C-trap into the Orbitrap, and MS2 packets go forward toward the Astral side.</p>'],
 oct:['Transfer octapole','<p>A 350 mm-long octapole that carries MS2 packets from the IRM to the ion processor. It is one of the longest parts of the ion path, which is why the line in Thermo’s rendering looks so long.</p>'],
 ip:['Ion processor','<p>A small linear quadrupole trap (inscribed radius r₀ = 2 mm) with two pressure regions. In the <b>high-pressure</b> section (about 10⁻² mbar), ions are fragmented by HCD and cooled. In the <b>low-pressure</b> section (2–4 × 10⁻³ mbar), the packet is compressed and pulsed out into the Astral analyzer.</p><p>The quad fills the next packet while this one fragments and the previous one is in flight. That pipelining is how the instrument reaches up to 200 MS2 scans per second.</p>'],
 inj:['Injection optics','<p>“Letterbox” lenses and an electrostatic prism shape the packet and launch it between the mirrors. The ions start at a shallow angle of about 2° to the reflection axis, so each pass only moves them a little way down the mirrors.</p>'],
 mirrors:['Asymmetric ion mirrors (Astral analyzer)','<p>Two long, gridless ion mirrors made of 5 electrodes each. Ions fly through the slit between the upper and lower plates. The effective distance between the mirrors is about <b>640 mm</b>, so every pass across the gap is long.</p><p>The mirrors converge by only about <b>0.3 mm</b> along their length (drawn 20× larger here). That tiny asymmetry slows the ions’ drift, stops it about <b>335 mm</b> from the injection point, and sends the ions back. In total ions make about <b>24 oscillations</b>, a track of roughly 30 m, and reach the detector after about 0.8 ms for m/z 524. That gives up to about 80,000 resolution at m/z 524.</p><p>Slow the animation down (speed 0.1–0.3) to follow individual ions. The red line is one ion’s full track.</p>'],
 foil:['Ion foil','<p>A pair of shaped plates mounted <b>above and below</b> the ion path between the mirrors, biased at a small adjustable voltage (0 to −20 V). Converging mirrors would otherwise make each oscillation slightly shorter the further ions drift, which smears arrival times. The foil corrects this: ions spend a different fraction of each pass at the foil potential depending on how far they have drifted. That keeps the oscillation period constant and also focuses the packet back onto the detector.</p><p>The outline here is traced from the plan-view schematic in Stewart et al. (2023). A central “bell” starts at the injection prism and widens with drift distance. Two outer wedges near the mirrors taper the opposite way and are not mirror images of each other. The proportions are read off the schematic, so they are approximate rather than engineering dimensions.</p>'],
 det:['High dynamic range detector','<p>At the injection end of the mirrors, beside the beam axis on the tilted-mirror side (where the schematic puts it). Returning ions are post-accelerated (about 10 kV) onto a conversion dynode. Its output goes to a scintillator and photomultiplier with two gain channels, which lets the detector see single ions and still handle intense peaks.</p>']};
const info=document.getElementById('info');
function showInfo(k){document.getElementById('infoT').textContent=INFO[k][0];document.getElementById('infoB').innerHTML=INFO[k][1];info.hidden=false;}
document.getElementById('infoX').onclick=()=>info.hidden=true;
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)return;const r=renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);const h=ray.intersectObjects(pickables,false)[0];if(h)showInfo(h.object.userData.key);});

/* ============ camera ============ */
let camAnim=null;
function view(v){const a=camera.aspect,k=1/Math.min(a,1.3);let tgt,pos;
  if(v==="overview"){tgt=a<1?new THREE.Vector3(12,0,4):new THREE.Vector3(7,-1,0);pos=a<1?tgt.clone().add(new THREE.Vector3(-.8,.62,.55).normalize().multiplyScalar(66/Math.max(a,.5))):tgt.clone().add(new THREE.Vector3(-.3,.6,1).normalize().multiplyScalar(Math.max(55,80/Math.min(a,1.7))));}
  else if(v==='front'){tgt=new THREE.Vector3(-27,0,1);pos=new THREE.Vector3(-28,4,11*k);}
  else if(v==='ctrap'){tgt=new THREE.Vector3(CTX+.5,-1.2,0);pos=new THREE.Vector3(CTX+2.5,1.5,6*k);}
  else if(v==='ip'){tgt=new THREE.Vector3(19.5,0,0);pos=new THREE.Vector3(18,2.5,6*k);}
  else{tgt=new THREE.Vector3(A.x0+8,0,0);pos=a<1?new THREE.Vector3(A.x0-14,30,30*k*.8):new THREE.Vector3(A.x0+8,40,22);}
  camAnim={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,s:performance.now()};}
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>view(b.dataset.v));
document.getElementById('speed').oninput=e=>speed=+e.target.value;
document.getElementById('ww').onchange=e=>{const st=Math.max(0,curSlot+3);CFGS.splice(0,CFGS.length,...CFGS.filter(c=>c.start<st));CFGS.push(makeCfg(st,+e.target.value));OTE.clear();};
const pb=document.getElementById('pause');pb.onclick=()=>{paused=!paused;pb.textContent=paused?'Play':'Pause';};
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);labelR.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
view('overview');camera.position.copy(camAnim.p1);controls.target.copy(camAnim.t1);camAnim=null;

/* ============ loop ============ */
for(let i=0;i<300;i++){simT+=1/60;update(1/60);}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  if(camAnim){let k=Math.min(1,(now-camAnim.s)/900);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(camAnim.p0,camAnim.p1,k);controls.target.lerpVectors(camAnim.t0,camAnim.t1,k);if(k>=1)camAnim=null;}
  if(!paused){simT+=dt*speed;update(dt*speed);}
  writeInstances();updateStatus();drawPanel();controls.update();renderer.render(scene,camera);labelR.render(scene,camera);}
requestAnimationFrame(loop);
</script>
</body>
